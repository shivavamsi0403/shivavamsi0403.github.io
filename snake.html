<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        body {
            margin: 0;
            background: #0b132b;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #38bdf8;
        }

        canvas {
            background: #111827;
            border: 3px solid #38bdf8;
            max-width: 90%;
        }

        button {
            margin: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #38bdf8;
            font-size: 18px;
        }

        .controls {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<h1>🐍 Snake Game</h1>

<p>Score: <span id="score">0</span></p>

<canvas id="game" width="300" height="300"></canvas>

<div class="controls">
    <div>
        <button onclick="move('up')">⬆️</button>
    </div>

    <div>
        <button onclick="move('left')">⬅️</button>
        <button onclick="move('down')">⬇️</button>
        <button onclick="move('right')">➡️</button>
    </div>
</div>

<button onclick="restart()">🔄 Restart</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;

let snake;
let food;
let direction;
let score;
let game;

function restart() {

    snake = [
        {x: 140, y: 140},
        {x: 120, y: 140},
        {x: 100, y: 140}
    ];

    food = {
        x: Math.floor(Math.random() * 15) * size,
        y: Math.floor(Math.random() * 15) * size
    };

    direction = "right";
    score = 0;

    document.getElementById("score").innerText = score;

    clearInterval(game);
    game = setInterval(draw, 120);
}

function move(newDirection) {

    if (newDirection === "up" && direction !== "down")
        direction = "up";

    if (newDirection === "down" && direction !== "up")
        direction = "down";

    if (newDirection === "left" && direction !== "right")
        direction = "left";

    if (newDirection === "right" && direction !== "left")
        direction = "right";
}

function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let head = {
        x: snake[0].x,
        y: snake[0].y
    };

    if (direction === "up") head.y -= size;
    if (direction === "down") head.y += size;
    if (direction === "left") head.x -= size;
    if (direction === "right") head.x += size;

    // Game over
    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= canvas.width ||
        head.y >= canvas.height ||
        snake.some(part => part.x === head.x && part.y === head.y)
    ) {

        clearInterval(game);

        alert("Game Over! Score: " + score);

        return;
    }

    snake.unshift(head);

    // Eat food
    if (head.x === food.x && head.y === food.y) {

        score++;

        document.getElementById("score").innerText = score;

        food = {
            x: Math.floor(Math.random() * 15) * size,
            y: Math.floor(Math.random() * 15) * size
        };

    } else {

        snake.pop();
    }

    // Draw snake
    ctx.fillStyle = "#22c55e";

    snake.forEach(part => {
        ctx.fillRect(part.x, part.y, size - 2, size - 2);
    });

    // Draw food
    ctx.fillStyle = "#ef4444";

    ctx.fillRect(food.x, food.y, size - 2, size - 2);
}

// Keyboard controls
document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp") move("up");
    if (event.key === "ArrowDown") move("down");
    if (event.key === "ArrowLeft") move("left");
    if (event.key === "ArrowRight") move("right");

});

restart();

</script>

</body>
</html>
