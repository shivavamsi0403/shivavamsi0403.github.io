<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Snake Game | Indra Sena</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at top, #071d3d 0%, #020817 45%, #00030a 100%);
    text-align: center;
    overflow-x: hidden;
}

/* Background glow */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 20% 30%, rgba(0,180,255,.08), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(0,255,80,.06), transparent 25%);
}

/* Main container */
.game-container {
    width: 100%;
    max-width: 1050px;
    margin: auto;
    padding: 20px 15px 40px;
    position: relative;
}

/* Header */
.title {
    font-size: clamp(45px, 10vw, 90px);
    margin: 5px 0 0;
    font-weight: 900;
    letter-spacing: 2px;
    color: #67ff18;
    text-shadow:
        0 0 8px #55ff00,
        0 0 20px #22cc00,
        0 0 40px #11aa00;
}

.subtitle {
    font-size: 22px;
    letter-spacing: 6px;
    font-weight: bold;
    margin: -5px 0 20px;
}

/* Score panels */
.top-info {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 18px;
}

.info-box {
    width: 210px;
    padding: 14px;
    border: 2px solid #087bdc;
    border-radius: 22px;
    background: rgba(0, 8, 25, .8);
    box-shadow:
        0 0 10px rgba(0,150,255,.3),
        inset 0 0 15px rgba(0,100,255,.12);
}

.info-title {
    font-size: 20px;
    font-weight: bold;
    color: white;
}

.score {
    margin-top: 8px;
    font-size: 38px;
    font-weight: bold;
    color: white;
}

/* Controls bar */
.control-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 15px auto 25px;
    flex-wrap: wrap;
}

.control-button {
    width: 75px;
    height: 60px;
    border-radius: 15px;
    border: 2px solid #00aaff;
    background: #04142c;
    color: white;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(0,170,255,.35);
}

.control-button:active {
    transform: scale(.94);
}

.speed-box {
    padding: 17px 28px;
    min-width: 220px;
    border: 2px solid #075e9e;
    border-radius: 15px;
    background: #031025;
    font-size: 19px;
    font-weight: bold;
}

select {
    background: transparent;
    border: none;
    color: #52ff2d;
    font-size: 18px;
    font-weight: bold;
    outline: none;
}

select option {
    background: #07152d;
    color: white;
}

/* Game board */
.board-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
}

#gameCanvas {
    width: min(90vw, 720px);
    height: min(90vw, 720px);
    max-width: 720px;
    max-height: 720px;

    border: 3px solid #00b7ff;
    border-radius: 25px;

    background:
        linear-gradient(rgba(0,30,55,.5), rgba(0,10,25,.8));

    box-shadow:
        0 0 10px #00aaff,
        0 0 35px rgba(0,160,255,.25),
        inset 0 0 30px rgba(0,150,255,.1);

    touch-action: none;
}

/* Bottom controls */
.mobile-controls {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    justify-content: center;
    gap: 8px;
    margin: 25px auto 15px;
}

.direction {
    width: 80px;
    height: 65px;
    border-radius: 15px;
    border: 2px solid #00aaff;
    background: #04142c;
    color: white;
    font-size: 30px;
    box-shadow: 0 0 12px rgba(0,170,255,.3);
}

.direction:active {
    transform: scale(.92);
    background: #073b63;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
}

.down {
    grid-column: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

/* Restart */
.restart {
    display: inline-block;
    margin: 15px;
    padding: 16px 35px;
    border-radius: 15px;
    border: 2px solid #ffae00;
    background: #180d00;
    color: #ffbd22;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255,150,0,.3);
}

.restart:active {
    transform: scale(.95);
}

/* Back button */
.back {
    display: inline-block;
    margin-top: 15px;
    padding: 14px 25px;
    border-radius: 15px;
    border: 2px solid #00aaff;
    color: #39c5ff;
    text-decoration: none;
    font-weight: bold;
    font-size: 17px;
    background: #031025;
}

/* Instructions */
.instructions {
    max-width: 500px;
    margin: 30px auto 0;
    padding: 20px;
    border: 2px solid #073d72;
    border-radius: 20px;
    background: rgba(2,12,30,.75);
    text-align: left;
}

.instructions h2 {
    color: #63ff29;
    margin-top: 0;
}

.instructions p {
    color: #d0d9e8;
    line-height: 1.7;
}

/* Game over */
.game-over {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,10,.85);
    z-index: 20;
    align-items: center;
    justify-content: center;
}

.game-over-box {
    width: min(90%, 400px);
    padding: 35px;
    border: 2px solid #00baff;
    border-radius: 25px;
    background: #07152d;
    box-shadow: 0 0 35px rgba(0,180,255,.5);
}

.game-over-box h2 {
    font-size: 38px;
    color: #ff4242;
}

.game-over-box p {
    font-size: 20px;
}

.game-over-box button {
    padding: 14px 30px;
    border: none;
    border-radius: 12px;
    background: #20bfff;
    font-size: 18px;
    font-weight: bold;
}

/* Mobile */
@media (max-width: 600px) {

    .game-container {
        padding-top: 12px;
    }

    .subtitle {
        font-size: 14px;
        letter-spacing: 4px;
    }

    .top-info {
        justify-content: center;
    }

    .info-box {
        width: 45%;
        min-width: 130px;
    }

    .info-title {
        font-size: 15px;
    }

    .score {
        font-size: 28px;
    }

    .control-bar {
        gap: 8px;
    }

    .speed-box {
        min-width: 180px;
        padding: 14px;
    }

    #gameCanvas {
        width: 92vw;
        height: 92vw;
        border-radius: 18px;
    }

    .instructions {
        margin-left: 8px;
        margin-right: 8px;
    }
}
</style>
</head>

<body>

<div class="game-container">

    <h1 class="title">SNAKE</h1>
    <div class="subtitle">• CLASSIC GAME •</div>

    <!-- SCORE -->
    <div class="top-info">

        <div class="info-box">
            <div class="info-title">SCORE</div>
            <div class="score" id="score">0</div>
        </div>

        <div class="info-box">
            <div class="info-title">🏆 BEST</div>
            <div class="score" id="best">0</div>
        </div>

    </div>

    <!-- GAME SETTINGS -->
    <div class="control-bar">

        <button class="control-button" id="pauseButton">
            ⏸
        </button>

        <div class="speed-box">
            SPEED:
            <select id="speed">
                <option value="150">Slow</option>
                <option value="110" selected>Normal</option>
                <option value="80">Fast</option>
                <option value="55">Extreme</option>
            </select>
        </div>

        <button class="control-button" id="soundButton">
            🔊
        </button>

    </div>

    <!-- GAME -->
    <div class="board-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <!-- MOBILE CONTROLS -->
    <div class="mobile-controls">

        <button class="direction up" onclick="changeDirection('up')">
            ⬆
        </button>

        <button class="direction left" onclick="changeDirection('left')">
            ⬅
        </button>

        <button class="direction down" onclick="changeDirection('down')">
            ⬇
        </button>

        <button class="direction right" onclick="changeDirection('right')">
            ➡
        </button>

    </div>

    <button class="restart" onclick="restartGame()">
        🔄 RESTART
    </button>

    <br>

    <a href="index.html" class="back">
        ← BACK TO PORTFOLIO
    </a>

    <!-- INSTRUCTIONS -->
    <div class="instructions">

        <h2>HOW TO PLAY</h2>

        <p>
            ⬅️ Use the arrow keys or the on-screen buttons
            to move the snake.
        </p>

        <p>
            🍎 Eat the red food to grow longer and increase
            your score.
        </p>

        <p>
            💥 Don't hit the wall or yourself!
        </p>

    </div>

</div>

<!-- GAME OVER -->
<div class="game-over" id="gameOver">

    <div class="game-over-box">

        <h2>GAME OVER</h2>

        <p>
            Your Score:
            <strong id="finalScore">0</strong>
        </p>

        <button onclick="restartGame()">
            🔄 PLAY AGAIN
        </button>

    </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const grid = 30;
const tile = canvas.width / grid;

let snake;
let food;
let direction;
let nextDirection;

let score = 0;
let best = Number(localStorage.getItem("snakeBest")) || 0;

let gameTimer = null;
let paused = false;
let soundOn = true;

document.getElementById("best").textContent = best;


/* =========================
   START GAME
========================= */

function restartGame() {

    clearInterval(gameTimer);

    snake = [
        { x: 15, y: 15 },
        { x: 14, y: 15 },
        { x: 13, y: 15 }
    ];

    direction = "right";
    nextDirection = "right";

    score = 0;
    paused = false;

    document.getElementById("score").textContent = score;
    document.getElementById("pauseButton").textContent = "⏸";

    document.getElementById("gameOver").style.display = "none";

    createFood();

    startGame();

    draw();
}


/* =========================
   START TIMER
========================= */

function startGame() {

    const speed =
        Number(document.getElementById("speed").value);

    clearInterval(gameTimer);

    gameTimer = setInterval(gameLoop, speed);
}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (paused) return;

    direction = nextDirection;

    const head = {
        x: snake[0].x,
        y: snake[0].y
    };

    if (direction === "up")
        head.y--;

    if (direction === "down")
        head.y++;

    if (direction === "left")
        head.x--;

    if (direction === "right")
        head.x++;

    /* Wall collision */

    if (
        head.x < 0 ||
        head.x >= grid ||
        head.y < 0 ||
        head.y >= grid
    ) {

        endGame();
        return;
    }

    /* Body collision */

    for (let i = 0; i < snake.length; i++) {

        if (
            head.x === snake[i].x &&
            head.y === snake[i].y
        ) {

            endGame();
            return;
        }
    }

    snake.unshift(head);

    /* Food */

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        document.getElementById("score").textContent = score;

        if (score > best) {

            best = score;

            localStorage.setItem(
                "snakeBest",
                best
            );

            document.getElementById("best").textContent = best;
        }

        beep();

        createFood();

    } else {

        snake.pop();
    }

    draw();
}


/* =========================
   DRAW GAME
========================= */

function draw() {

    /* Background */

    ctx.fillStyle = "#020b18";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* Grid */

    ctx.strokeStyle = "rgba(0,150,255,.13)";
    ctx.lineWidth = 1;

    for (let i = 0; i <= grid; i++) {

        ctx.beginPath();

        ctx.moveTo(i * tile, 0);
        ctx.lineTo(i * tile, canvas.height);

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(0, i * tile);
        ctx.lineTo(canvas.width, i * tile);

        ctx.stroke();
    }

    /* Food glow */

    ctx.shadowColor = "#ff2222";
    ctx.shadowBlur = 25;

    ctx.fillStyle = "#ff3434";

    ctx.beginPath();

    ctx.arc(
        food.x * tile + tile / 2,
        food.y * tile + tile / 2,
        tile * .34,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    /* Snake */

    snake.forEach((part, index) => {

        const x = part.x * tile + 2;
        const y = part.y * tile + 2;

        const size = tile - 4;

        ctx.shadowColor =
            index === 0 ? "#7cff00" : "#36ff00";

        ctx.shadowBlur =
            index === 0 ? 18 : 10;

        ctx.fillStyle =
            index === 0 ? "#a0ff00" : "#58e600";

        roundRect(
            ctx,
            x,
            y,
            size,
            size,
            7
        );

        ctx.fill();

    });

    ctx.shadowBlur = 0;

    /* Snake eyes */

    const head = snake[0];

    const eyeX =
        head.x * tile + tile * .65;

    const eyeY =
        head.y * tile + tile * .30;

    ctx.fillStyle = "black";

    ctx.beginPath();

    ctx.arc(
        eyeX,
        eyeY,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* Rounded rectangle */

function roundRect(
    context,
    x,
    y,
    width,
    height,
    radius
) {

    context.beginPath();

    context.moveTo(x + radius, y);

    context.lineTo(
        x + width - radius,
        y
    );

    context.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
    );

    context.lineTo(
        x + width,
        y + height - radius
    );

    context.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
    );

    context.lineTo(
        x + radius,
        y + height
    );

    context.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
    );

    context.lineTo(
        x,
        y + radius
    );

    context.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
    );

    context.closePath();
}


/* =========================
   FOOD
========================= */

function createFood() {

    let valid = false;

    while (!valid) {

        food = {
            x: Math.floor(Math.random() * grid),
            y: Math.floor(Math.random() * grid)
        };

        valid = !snake.some(
            part =>
                part.x === food.x &&
                part.y === food.y
        );
    }
}


/* =========================
   MOVEMENT
========================= */

function changeDirection(newDirection) {

    if (
        newDirection === "up" &&
        direction !== "down"
    ) {
        nextDirection = "up";
    }

    if (
        newDirection === "down" &&
        direction !== "up"
    ) {
        nextDirection = "down";
    }

    if (
        newDirection === "left" &&
        direction !== "right"
    ) {
        nextDirection = "left";
    }

    if (
        newDirection === "right" &&
        direction !== "left"
    ) {
        nextDirection = "right";
    }
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowUp") {
            event.preventDefault();
            changeDirection("up");
        }

        if (event.key === "ArrowDown") {
            event.preventDefault();
            changeDirection("down");
        }

        if (event.key === "ArrowLeft") {
            event.preventDefault();
            changeDirection("left");
        }

        if (event.key === "ArrowRight") {
            event.preventDefault();
            changeDirection("right");
        }

        if (event.key === " ") {
            togglePause();
        }
    }
);


/* =========================
   PAUSE
========================= */

document.getElementById("pauseButton")
.addEventListener(
    "click",
    togglePause
);

function togglePause() {

    paused = !paused;

    document.getElementById("pauseButton")
        .textContent =
        paused ? "▶" : "⏸";
}


/* =========================
   SPEED
========================= */

document.getElementById("speed")
.addEventListener(
    "change",
    startGame
);


/* =========================
   SOUND
========================= */

document.getElementById("soundButton")
.addEventListener(
    "click",
    function() {

        soundOn = !soundOn;

        this.textContent =
            soundOn ? "🔊" : "🔇";
    }
);


/* Simple game sound */

function beep() {

    if (!soundOn) return;

    try {

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.frequency.value = 600;

        gain.gain.value = 0.04;

        oscillator.connect(gain);

        gain.connect(audio.destination);

        oscillator.start();

        oscillator.stop(
            audio.currentTime + .08
        );

    } catch (e) {}
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    clearInterval(gameTimer);

    document.getElementById(
        "finalScore"
    ).textContent = score;

    document.getElementById(
        "gameOver"
    ).style.display = "flex";
}


/* START */

restartGame();

</script>

</body>
    </html>
