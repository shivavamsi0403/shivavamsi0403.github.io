<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
body {
    margin: 0;
    background: #0b1220;
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    color: #38bdf8;
}

#game {
    width: 300px;
    height: 300px;
    background: #111827;
    border: 3px solid #38bdf8;
    margin: 20px auto;
    display: block;
}

.controls {
    margin: 15px auto;
    width: 220px;
}

button {
    width: 65px;
    height: 55px;
    margin: 4px;
    border: none;
    border-radius: 12px;
    background: #38bdf8;
    font-size: 24px;
    font-weight: bold;
}

button:active {
    transform: scale(0.9);
}

#score {
    font-size: 20px;
}

.back {
    background: #1e293b;
    color: white;
    width: auto;
    padding: 12px 25px;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>🐍 Snake Game</h1>

<p id="score">Score: 0</p>

<canvas id="game" width="300" height="300"></canvas>

<div class="controls">
    <div>
        <button onclick="changeDirection('up')">⬆️</button>
    </div>

    <div>
        <button onclick="changeDirection('left')">⬅️</button>
        <button onclick="changeDirection('down')">⬇️</button>
        <button onclick="changeDirection('right')">➡️</button>
    </div>
</div>

<button class="back" onclick="location.href='index.html'">
    ← Back to Portfolio
</button>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 15;

let snake = [
    {x: 150, y: 150}
];

let food = {
    x: Math.floor(Math.random() * 20) * box,
    y: Math.floor(Math.random() * 20) * box
};

let direction = "right";
let score = 0;
let gameOver = false;

function changeDirection(newDirection) {

    if (newDirection === "up" && direction !== "down")
        direction = "up";

    if (newDirection === "down" && direction !== "up")
        direction = "down";

    if (newDirection === "left" && direction !== "right")
        direction = "left";

    if (newDirection === "right" && direction !== "left")
        direction = "right";
}

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowUp")
        changeDirection("up");

    if (event.key === "ArrowDown")
        changeDirection("down");

    if (event.key === "ArrowLeft")
        changeDirection("left");

    if (event.key === "ArrowRight")
        changeDirection("right");
});

function draw() {

    if (gameOver) {
        ctx.fillStyle = "#111827";
        ctx.fillRect(0, 0, 300, 300);

        ctx.fillStyle = "#ef4444";
        ctx.font = "30px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", 150, 135);

        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText("Refresh to play again", 150, 170);

        return;
    }

    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, 300, 300);

    // Snake
    for (let i = 0; i < snake.length; i++) {

        ctx.fillStyle = i === 0 ? "#22c55e" : "#4ade80";

        ctx.fillRect(
            snake[i].x,
            snake[i].y,
            box - 1,
            box - 1
        );
    }

    // Food
    ctx.fillStyle = "#ef4444";

    ctx.fillRect(
        food.x,
        food.y,
        box - 1,
        box - 1
    );

    let head = {
        x: snake[0].x,
        y: snake[0].y
    };

    if (direction === "up")
        head.y -= box;

    if (direction === "down")
        head.y += box;

    if (direction === "left")
        head.x -= box;

    if (direction === "right")
        head.x += box;

    // Wall collision
    if (
        head.x < 0 ||
        head.x >= 300 ||
        head.y < 0 ||
        head.y >= 300
    ) {
        gameOver = true;
        return;
    }

    // Snake collision
    for (let i = 0; i < snake.length; i++) {

        if (
            head.x === snake[i].x &&
            head.y === snake[i].y
        ) {
            gameOver = true;
            return;
        }
    }

    snake.unshift(head);

    // Eat food
    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        document.getElementById("score").innerText =
            "Score: " + score;

        food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };

    } else {

        snake.pop();
    }
}

setInterval(draw, 120);

</script>

</body>
</html>
